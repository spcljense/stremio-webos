<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Stremio</title>
    <script>window.__STREMIO_SERVER_URL__ = 'http://127.0.0.1:8080';</script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(rs) {
                rs.forEach(function(r) { r.unregister(); });
            }).catch(function(){});
        }
    </script>
    <script defer src="runtime.js"></script>
    <script defer src="main.js"></script>
    <script defer src="service.js"></script>
    <script defer src="webOSTV.js"></script>
    <!-- Full-fidelity ASS rendering (docs/ASS-SUBTITLE-RENDERING-PLAN.md).
         Forked JASSUB 1.8.8 (externalClock/renderAt) + transition-anchored PLL
         clock controller. P0 probe (/ass-probe.js) retired; re-add that tag to
         re-run diagnostics. -->
    <script defer src="/jassub/jassub-ekitabu.umd.js"></script>
    <script defer src="/ass-track-map.js"></script>
    <script defer src="/ass-controller.js"></script>
</head>
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
</body>
</html>
