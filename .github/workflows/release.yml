name: Release

on:
  push:
    tags:
      - 'stremio-webos-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#stremio-webos-}" >> "$GITHUB_OUTPUT"

      - name: Set package version
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          jq --arg v "$VERSION" \
            '.version = $v' \
            app/appinfo.json > appinfo.tmp

          mv appinfo.tmp app/appinfo.json

          jq --arg v "$VERSION" \
            '.version = $v' \
            service/package.json > package.tmp

          mv package.tmp service/package.json

      - name: Install webOS CLI
        run: |
          npm install -g @webos-tools/cli
          ares-config --profile tv
          ares -V

      - name: Build package
        run: make package

      - name: Verify package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IPK="io.strem.webos_${VERSION}_all.ipk"

          test -f "$IPK"
          ares-package -i "$IPK"
          ares-package -I "$IPK"
      
      - name: Generate Homebrew manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IPK="io.strem.webos_${VERSION}_all.ipk"

          SHA256=$(sha256sum "$IPK" | cut -d' ' -f1)
          SIZE=$(stat --format=%s "$IPK")

          cat > manifest.json << EOF2
          {
            "id": "io.strem.webos",
            "version": "${VERSION}",
            "type": "web",
            "title": "Stremio",
            "appDescription": "Standalone optimized Stremio build for LG webOS TVs.",
            "iconUri": "https://raw.githubusercontent.com/spcljense/stremio-webos/main/app/icon.png",
            "sourceUrl": "https://github.com/spcljense/stremio-webos",
            "rootRequired": false,
            "ipkUrl": "${IPK}",
            "ipkHash": {
              "sha256": "${SHA256}"
            },
            "ipkSize": ${SIZE}
          }
          EOF2

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            io.strem.webos_${{ steps.version.outputs.version }}_all.ipk
            manifest.json
