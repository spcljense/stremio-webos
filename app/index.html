<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Stremio</title>
  <style>
    body {
      background: #0c0b11;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      color: #ffffff;
      overflow: hidden;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(255, 255, 255, 0.1);
      border-top-color: #7b5bf5;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #status {
      color: rgba(255, 255, 255, 0.7);
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

<div id="loader" style="display:flex; flex-direction:column; align-items:center;">
  <div class="spinner"></div>
  <div id="status">Loading Stremio...</div>
</div>

<script>
var done = false;

// Global persistent bridge prevents V8 garbage collection
var bridge = new PalmServiceBridge();
bridge.onservicecallback = function(response) {
    try {
        var data = JSON.parse(response);
        if (data && data.ready) {
            done = true;
            location.replace('http://127.0.0.1:8080/');
        }
    } catch(e) {
        console.error("Bridge parse error:", e);
    }
};

// Call the background service
bridge.call('luna://io.strem.webos.server/start', '{}');

// Secondary polling fallback in case Luna notification is delayed
var pollCount = 0;
var pollInterval = setInterval(function() {
    if (done) {
        clearInterval(pollInterval);
        return;
    }
    pollCount++;
    var img = new Image();
    img.onload = function() {
        done = true;
        clearInterval(pollInterval);
        location.replace('http://127.0.0.1:8080/');
    };
    img.src = 'http://127.0.0.1:8080/favicon.ico?_t=' + Date.now();

    if (pollCount > 30) clearInterval(pollInterval);
}, 1000);

// Remote control Back button (Keycode 461)
window.addEventListener('keydown', function(e) {
    if (e.keyCode === 461 || e.keyCode === 27) {
        if (window.PalmSystem && window.PalmSystem.close) {
            window.PalmSystem.close();
        } else {
            window.close();
        }
    }
});

// 30s timeout fallback screen
setTimeout(function() {
    if (done) return;
    document.body.innerHTML =
        '<div style="color:#fff;text-align:center;max-width:600px;padding:0 24px">' +
        '<div style="font-size:26px;font-weight:600;margin-bottom:12px;color:#ff5b5b">Stremio service didn\'t start</div>' +
        '<div style="color:rgba(255,255,255,0.6);font-size:16px;line-height:1.5;margin-bottom:32px">Try again, or check Homebrew Channel logs if this keeps happening.</div>' +
        '<button onclick="location.reload()" style="padding:12px 32px;font-size:18px;background:#7b5bf5;color:#fff;border:0;border-radius:8px;cursor:pointer;outline:none">Retry</button>' +
        '</div>';
}, 30000);
</script>
</body>
</html>
